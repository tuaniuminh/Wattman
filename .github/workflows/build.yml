name: Build and Release Wattman

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl xz-utils zip make ca-certificates imagemagick

      - name: Setup iOS SDK and LLVM Toolchain
        run: |
          set -e
          mkdir -p $HOME/theos/sdks $HOME/theos/toolchain
          
          # Download iOS 13.7 SDK
          echo "[*] Downloading iPhoneOS13.7 SDK..."
          curl -sL https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS13.7.sdk.tar.xz -o sdk.tar.xz
          tar -xf sdk.tar.xz -C $HOME/theos/sdks
          rm sdk.tar.xz

          # Download iOS Cross-Toolchain (Clang + ldid)
          echo "[*] Downloading iOS toolchain..."
          curl -sL https://github.com/L1ghtmann/llvm-project/releases/download/main-update_3-eabca92/iOSToolchain-x86_64.tar.xz -o toolchain.tar.xz
          tar -xf toolchain.tar.xz -C $HOME/theos/toolchain
          rm toolchain.tar.xz

          # Fix CGColor header compatibility in older SDKs if needed
          header="$HOME/theos/sdks/iPhoneOS13.7.sdk/System/Library/Frameworks/CoreGraphics.framework/Headers/CGColor.h"
          if [ -f "$header" ]; then
            sed -i 's/) CG_UNAVAILABLE_EMBEDDED/, 2.0)/g' "$header" || true
          fi

      - name: Generate App Icons (JPG → PNG, multi-size)
        run: |
          set -e
          SRC="Wattman/Resources/AppIcon.jpg"
          RES="Wattman/Resources"
          if [ -f "$SRC" ]; then
            echo "[*] Converting AppIcon.jpg → PNG sizes..."
            # iPhone @2x: 120×120, @3x: 180×180, Settings: 58×58, Spotlight: 80×80, Store: 1024×1024
            convert "$SRC" -resize 120x120! "$RES/AppIcon@2x.png"
            convert "$SRC" -resize 180x180! "$RES/AppIcon@3x.png"
            convert "$SRC" -resize 58x58!   "$RES/AppIcon-Small@2x.png"
            convert "$SRC" -resize 87x87!   "$RES/AppIcon-Small@3x.png"
            convert "$SRC" -resize 80x80!   "$RES/AppIcon-Spotlight@2x.png"
            convert "$SRC" -resize 120x120! "$RES/AppIcon-Spotlight@3x.png"
            convert "$SRC" -resize 1024x1024! "$RES/AppIcon-1024.png"
            echo "[+] Icons generated successfully"
          else
            echo "[!] AppIcon.jpg not found, skipping icon generation"
          fi

      - name: Build Wattman IPA & TIPA
        run: |
          set -e
          export THEOS="$HOME/theos"
          export PATH="$THEOS/toolchain/linux/iphone/bin:$PATH"
          
          echo "[*] Compiler version:"
          $THEOS/toolchain/linux/iphone/bin/clang --version
          
          make -C Wattman all

      - name: Upload Build Artifacts (.ipa and .tipa)
        uses: actions/upload-artifact@v4
        with:
          name: Wattman-TrollStore
          path: |
            Wattman/build/Wattman.tipa
            Wattman/build/Wattman.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Wattman/build/Wattman.tipa
            Wattman/build/Wattman.ipa
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Release {0}', github.ref_name) || 'Wattman v1.0.0 (TrollStore Release)' }}
          draft: false
          prerelease: false
